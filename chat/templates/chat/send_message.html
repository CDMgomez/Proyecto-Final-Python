{% extends "base.html" %}

{% block title %}Enviar mensaje{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h4>Enviar mensaje</h4>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        {{ form.receiver.label_tag }}
        {{ form.receiver }}
      </div>
      <div class="mb-3">
        {{ form.content.label_tag }}
        {{ form.content }}
      </div>
      <button class="btn btn-primary" type="submit">Enviar</button>
      <a href="{% url 'chat:inbox' %}" class="btn btn-secondary ms-2">Volver</a>
    </form>
  </div>
</div>
{% endblock %}
