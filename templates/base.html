<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sanguchería{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand text-white" href="/">🍔 Sanguchería</a>
    <a class="nav-link text-white me-2" href="{% url 'about' %}">About</a>

    <div class="ms-auto">
        {% if user.is_authenticated %}
      <a href="{% url 'accounts:profile' %}" class="btn btn-outline-light btn-sm me-2">
    Mi perfil
</a>

      <a href="{% url 'chat:inbox' %}" class="btn btn-outline-light btn-sm me-2">Mensajes</a>
      <a href="{% url 'chat:send' %}" class="btn btn-outline-light btn-sm me-2">Enviar</a>

            <span class="text-white me-2">
                Hola {{ user.username }}
            </span>
           <form method="post" action="{% url 'logout' %}" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="btn btn-outline-light btn-sm">
        Logout
    </button>
</form>

        {% else %}
           <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">
    Login
</a>

<a class="btn btn-warning btn-sm ms-2" href="{% url 'signup' %}">
    Registrarse
</a>

        {% endif %}
    </div>
</nav>

<div class="container mt-4">
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags }}" role="alert">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
</div>

</body>
</html>
